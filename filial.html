<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filial - Solicitação e Recebimento</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f0f8ff; margin: 0; padding: 20px; color: #333; }
        h1 { color: #2980b9; border-bottom: 2px solid #2980b9; padding-bottom: 10px; }
        .container { display: flex; flex-direction: column; gap: 20px; margin-top: 20px; max-width: 1000px; }
        .section { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .form-row { display: flex; gap: 15px; margin-bottom: 15px; flex-wrap: wrap; }
        .form-group { display: flex; flex-direction: column; flex: 1; min-width: 200px; }
        .form-group label { font-weight: bold; margin-bottom: 5px; }
        .form-group input, .form-group select { padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 1em; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #2980b9; color: white; }
        .status-badge { padding: 5px 10px; border-radius: 4px; font-size: 0.9em; font-weight: bold; }
        .status-Pendente { background-color: #f1c40f; color: #000; }
        .status-Trânsito { background-color: #3498db; color: #fff; }
        .status-Entregue { background-color: #2ecc71; color: #fff; }
        .prioridade-Urgente { color: #e74c3c; font-weight: bold; }
        button { background-color: #3498db; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 4px; font-weight: bold; font-size: 1em; }
        button:hover { background-color: #2980b9; }
        .btn-confirmar { background-color: #2ecc71; }
        .btn-confirmar:hover { background-color: #27ae60; }
        #status-conexao { padding: 10px; margin-bottom: 20px; border-radius: 5px; font-weight: bold; background-color: #e74c3c; color: white; display: inline-block; }
    </style>
</head>
<body>

    <h1>Painel da Filial - Operações</h1>
    <div id="status-conexao">Desconectado da Matriz</div>

    <div class="container">
        <div class="section">
            <h2>Solicitar Reposição de Estoque</h2>
            <form id="form-pedido" onsubmit="enviarPedido(event)">
                <div class="form-row">
                    <div class="form-group">
                        <label for="select-filial">Selecione sua Filial:</label>
                        <select id="select-filial" required>
                            <option value="">Aguardando conexão...</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="select-prioridade">Prioridade do Pedido:</label>
                        <select id="select-prioridade" required>
                            <option value="Normal">Normal (Reposição de Rotina)</option>
                            <option value="Urgente">Urgente (Estoque Zerado / Paciente Aguardando)</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="select-medicamento">Medicamento Necessário:</label>
                        <select id="select-medicamento" required>
                            <option value="">Aguardando conexão...</option>
                        </select>
                    </div>

                    <div class="form-group" style="flex: 0.5;">
                        <label for="quantidade">Quantidade:</label>
                        <input type="number" id="quantidade" min="1" required>
                    </div>
                </div>

                <button type="submit">Enviar Pedido para Matriz</button>
            </form>
        </div>

        <div class="section">
            <h2>Acompanhamento e Recebimento</h2>
            <table>
                <thead>
                    <tr>
                        <th>Horário</th>
                        <th>Filial</th>
                        <th>Medicamento</th>
                        <th>Qtd.</th>
                        <th>Prioridade</th>
                        <th>Status</th>
                        <th>Ação de Recebimento</th>
                    </tr>
                </thead>
                <tbody id="tabela-meus-pedidos"></tbody>
            </table>
        </div>
    </div>

    <script>
        const ws = new WebSocket('ws://localhost:3000');
        
        const statusConexao = document.getElementById('status-conexao');
        const selectFilial = document.getElementById('select-filial');
        const selectMedicamento = document.getElementById('select-medicamento');
        const tabelaMeusPedidos = document.getElementById('tabela-meus-pedidos');

        let dadosAtuais = null;

        ws.onopen = () => {
            statusConexao.textContent = 'Conectado à Matriz (Sistema Online)';
            statusConexao.style.backgroundColor = '#2ecc71';
        };

        ws.onclose = () => {
            statusConexao.textContent = 'Desconectado da Matriz. Tentando reconectar...';
            statusConexao.style.backgroundColor = '#e74c3c';
        };

        ws.onmessage = (event) => {
            const resposta = JSON.parse(event.data);

            if (resposta.tipo === 'ESTADO_INICIAL' || resposta.tipo === 'ATUALIZACAO_GERAL') {
                dadosAtuais = resposta.dados;
                atualizarDropdownFiliais();
                atualizarDropdownMedicamentos();
                atualizarTabelaPedidos();
            }

            // Opcional: Se a filial tentar fazer um pedido maior que o estoque, o servidor pode barrar e enviar um erro.
            if (resposta.tipo === 'ERRO') {
                alert('Aviso da Matriz: ' + resposta.mensagem);
            }
        };

        function atualizarDropdownFiliais() {
            const valorAtual = selectFilial.value;
            selectFilial.innerHTML = '<option value="">Selecione a sua cidade...</option>';
            
            // Filtra apenas as filiais que não foram suspensas/excluídas pela matriz
            const filiaisAtivas = dadosAtuais.filiais.filter(f => f.status === 'Ativa');
            
            filiaisAtivas.forEach(f => {
                selectFilial.innerHTML += `<option value="${f.id}">${f.nome}</option>`;
            });

            if (valorAtual && filiaisAtivas.find(f => f.id === valorAtual)) {
                selectFilial.value = valorAtual;
            }
        }

        function atualizarDropdownMedicamentos() {
            const valorAtual = selectMedicamento.value;
            selectMedicamento.innerHTML = '<option value="">Selecione o medicamento...</option>';
            
            dadosAtuais.estoqueGlobal.forEach(med => {
                selectMedicamento.innerHTML += `<option value="${med.id}">${med.nome} (Estoque Central: ${med.quantidadeMatriz})</option>`;
            });

            if (valorAtual) selectMedicamento.value = valorAtual;
        }

        function atualizarTabelaPedidos() {
            tabelaMeusPedidos.innerHTML = '';
            
            const mapaFiliais = {};
            dadosAtuais.filiais.forEach(f => mapaFiliais[f.id] = f.nome);

            const mapaMed = {};
            dadosAtuais.estoqueGlobal.forEach(m => mapaMed[m.id] = m.nome);

            const pedidosReversos = [...dadosAtuais.pedidosFiliais].reverse();

            pedidosReversos.forEach(pedido => {
                const horaFormatada = new Date(pedido.idPedido).toLocaleTimeString('pt-BR', { hour12: false });
                const nomeFilial = mapaFiliais[pedido.filialId] || pedido.filialId;
                const nomeMed = mapaMed[pedido.medicamentoId] || `Med ID: ${pedido.medicamentoId}`;
                
                let classeStatus = 'status-Entregue';
                if(pedido.status === 'Pendente na Matriz') classeStatus = 'status-Pendente';
                else if(pedido.status === 'Aprovado e Em Trânsito') classeStatus = 'status-Trânsito';

                // A filial só pode confirmar entrega se o caminhão já estiver "Em Trânsito"
                const podeConfirmar = pedido.status === 'Aprovado e Em Trânsito';
                const jaEntregue = pedido.status === 'Entregue';

                let botaoAcao = '-';
                if (podeConfirmar) {
                    botaoAcao = `<button class="btn-confirmar" onclick="confirmarChegada(${pedido.idPedido})">Confirmar Recebimento</button>`;
                } else if (jaEntregue) {
                    botaoAcao = `<strong>OK</strong>`;
                } else {
                    botaoAcao = `<small>Aguardando Matriz</small>`;
                }

                tabelaMeusPedidos.innerHTML += `
                    <tr>
                        <td>${horaFormatada}</td>
                        <td>${nomeFilial}</td>
                        <td><strong>${nomeMed}</strong></td>
                        <td>${pedido.quantidade}</td>
                        <td class="prioridade-${pedido.prioridade}">${pedido.prioridade}</td>
                        <td><span class="status-badge ${classeStatus}">${pedido.status.split(' ')[0]}</span></td>
                        <td>${botaoAcao}</td>
                    </tr>
                `;
            });
        }

        function enviarPedido(event) {
            event.preventDefault();

            const filialId = selectFilial.value;
            const prioridade = document.getElementById('select-prioridade').value;
            const medicamentoId = parseInt(selectMedicamento.value);
            const quantidade = parseInt(document.getElementById('quantidade').value);

            if (!filialId || !medicamentoId || quantidade <= 0) {
                alert('Preencha todos os campos corretamente.');
                return;
            }

            ws.send(JSON.stringify({
                tipo: 'NOVO_PEDIDO',
                filialId: filialId,
                medicamentoId: medicamentoId,
                quantidade: quantidade,
                prioridade: prioridade
            }));
            
            document.getElementById('quantidade').value = '';
            // Reseta a prioridade para o padrão para evitar pedidos urgentes acidentais em seguida
            document.getElementById('select-prioridade').value = 'Normal'; 
        }

        function confirmarChegada(idPedido) {
            if(confirm('Confirmar que o caminhão chegou e os medicamentos estão no seu estoque local?')) {
                ws.send(JSON.stringify({
                    tipo: 'ATUALIZAR_STATUS_PEDIDO',
                    idPedido: idPedido,
                    novoStatus: 'Entregue'
                }));
            }
        }
    </script>
</body>
</html>
