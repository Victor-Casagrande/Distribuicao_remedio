<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matriz - Central do Meio-Oeste</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; color: #333; }
        h1 { color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .section { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; font-size: 0.9em; }
        th { background-color: #3498db; color: white; }
        .status-badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 0.8em; }
        .status-Pendente { background-color: #f1c40f; color: #000; }
        .status-Trânsito { background-color: #3498db; color: #fff; }
        .status-Entregue { background-color: #2ecc71; color: #fff; }
        .prioridade-Urgente { color: #e74c3c; font-weight: bold; }
        button { background-color: #27ae60; color: white; border: none; padding: 6px 10px; cursor: pointer; border-radius: 4px; }
        button:disabled { background-color: #95a5a6; cursor: not-allowed; }
        .btn-danger { background-color: #e74c3c; }
        .btn-warning { background-color: #f39c12; }
        .form-row { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; }
        input, select { padding: 6px; border: 1px solid #ccc; border-radius: 4px; }
        
        /* Estilos do Mapa Simulado */
        .mapa-container { position: relative; width: 100%; height: 250px; background-color: #ecf0f1; border: 2px solid #bdc3c7; border-radius: 8px; overflow: hidden; }
        .ponto-mapa { position: absolute; background: #34495e; color: white; padding: 5px 10px; border-radius: 15px; font-size: 0.8em; font-weight: bold; transform: translate(-50%, -50%); transition: all 0.3s ease; }
        
        /* Animação de Alerta no Mapa */
        @keyframes piscarVermelho {
            0% { background-color: #34495e; transform: translate(-50%, -50%) scale(1); }
            50% { background-color: #e74c3c; transform: translate(-50%, -50%) scale(1.2); box-shadow: 0 0 15px #e74c3c; }
            100% { background-color: #34495e; transform: translate(-50%, -50%) scale(1); }
        }
        .alerta-ativo { animation: piscarVermelho 1s infinite; z-index: 10; }
    </style>
</head>
<body>

    <h1>Matriz - Controle Regional (Meio-Oeste Catarinense)</h1>
    
    <div class="grid-container">
        <div class="section">
            <h2>Radar de Solicitações</h2>
            <div class="mapa-container" id="mapa-regiao">
                <div id="ponto-videira" class="ponto-mapa" style="top: 45%; left: 35%;">Videira</div>
                <div id="ponto-trezetilias" class="ponto-mapa" style="top: 35%; left: 45%;">Treze Tílias</div>
                <div id="ponto-joacaba" class="ponto-mapa" style="top: 65%; left: 50%;">Joaçaba</div>
                <div id="ponto-fraiburgo" class="ponto-mapa" style="top: 40%; left: 75%;">Fraiburgo</div>
                <div id="ponto-cacador" class="ponto-mapa" style="top: 15%; left: 40%;">Caçador</div>
            </div>
        </div>

        <div class="section">
            <h2>Pedidos em Tempo Real</h2>
            <table>
                <thead>
                    <tr>
                        <th>Hora</th>
                        <th>Filial</th>
                        <th>Pedido</th>
                        <th>Prioridade</th>
                        <th>Status</th>
                        <th>Ação</th>
                    </tr>
                </thead>
                <tbody id="tabela-pedidos"></tbody>
            </table>
        </div>

        <div class="section">
            <h2>Comprar Estoque para Matriz</h2>
            <div class="form-row">
                <select id="compra-medicamento">
                    <option value="novo">+ Cadastrar Novo Medicamento</option>
                </select>
                <input type="text" id="compra-nome" placeholder="Nome (Se novo)" style="display:none;">
                <input type="number" id="compra-qtd" placeholder="Qtd" min="1" style="width: 80px;">
                <button onclick="comprarEstoque()">Adicionar ao Estoque</button>
            </div>
            <table>
                <thead><tr><th>Medicamento</th><th>Disponível (Matriz)</th></tr></thead>
                <tbody id="tabela-estoque"></tbody>
            </table>
        </div>

        <div class="section">
            <h2>Gerenciar Filiais</h2>
            <div class="form-row">
                <input type="text" id="nova-filial-id" placeholder="ID (ex: tangara)">
                <input type="text" id="nova-filial-nome" placeholder="Nome da Cidade">
                <button onclick="adicionarFilial()">Nova Filial</button>
            </div>
            <table>
                <thead><tr><th>Cidade</th><th>Status</th><th>Ações</th></tr></thead>
                <tbody id="tabela-filiais"></tbody>
            </table>
        </div>
    </div>

    <script>
        const ws = new WebSocket('ws://localhost:3000');
        let dadosAtuais = null;

        ws.onmessage = (event) => {
            const resposta = JSON.parse(event.data);

            if (resposta.tipo === 'ESTADO_INICIAL' || resposta.tipo === 'ATUALIZACAO_GERAL') {
                dadosAtuais = resposta.dados;
                renderizarEstoque();
                renderizarPedidos();
                renderizarFiliais();
            }

            // Ativa o visual de alerta no mapa
            if (resposta.tipo === 'ALERTA_MAPA') {
                const ponto = document.getElementById(`ponto-${resposta.filialId}`);
                if (ponto) {
                    ponto.classList.add('alerta-ativo');
                }
            }

            if (resposta.tipo === 'ERRO') {
                alert(resposta.mensagem); // Alerta se tentar aprovar com estoque negativo
            }
        };

        // --- RENDERIZAÇÃO ---

        function renderizarEstoque() {
            const tab = document.getElementById('tabela-estoque');
            const sel = document.getElementById('compra-medicamento');
            tab.innerHTML = '';
            sel.innerHTML = '<option value="novo">+ Cadastrar Novo Medicamento</option>';
            
            dadosAtuais.estoqueGlobal.forEach(med => {
                tab.innerHTML += `<tr><td>${med.nome}</td><td><strong>${med.quantidadeMatriz}</strong></td></tr>`;
                sel.innerHTML += `<option value="${med.id}">${med.nome}</option>`;
            });
        }

        // Mostra o input de texto apenas se for cadastrar um remédio novo
        document.getElementById('compra-medicamento').addEventListener('change', function() {
            document.getElementById('compra-nome').style.display = this.value === 'novo' ? 'block' : 'none';
        });

        function renderizarPedidos() {
            const tab = document.getElementById('tabela-pedidos');
            tab.innerHTML = '';
            
            const mapaFiliais = {};
            dadosAtuais.filiais.forEach(f => mapaFiliais[f.id] = f.nome);

            const mapaMed = {};
            dadosAtuais.estoqueGlobal.forEach(m => mapaMed[m.id] = m.nome);

            [...dadosAtuais.pedidosFiliais].reverse().forEach(p => {
                const hora = new Date(p.idPedido).toLocaleTimeString('pt-BR', { hour12: false });
                const nomeFilial = mapaFiliais[p.filialId] || p.filialId;
                const nomeMed = mapaMed[p.medicamentoId] || `Med ${p.medicamentoId}`;
                const isPendente = p.status === 'Pendente na Matriz';
                
                let classeStatus = 'status-Entregue';
                if(isPendente) classeStatus = 'status-Pendente';
                else if(p.status === 'Aprovado e Em Trânsito') classeStatus = 'status-Trânsito';

                tab.innerHTML += `
                    <tr>
                        <td>${hora}</td>
                        <td>${nomeFilial}</td>
                        <td>${p.quantidade}x ${nomeMed}</td>
                        <td class="prioridade-${p.prioridade}">${p.prioridade}</td>
                        <td><span class="status-badge ${classeStatus}">${p.status.split(' ')[0]}</span></td>
                        <td>
                            <button onclick="aprovarPedido(${p.idPedido}, '${p.filialId}')" ${!isPendente ? 'disabled' : ''}>
                                ${isPendente ? 'Aprovar' : 'Concluído'}
                            </button>
                        </td>
                    </tr>
                `;
            });
        }

        function renderizarFiliais() {
            const tab = document.getElementById('tabela-filiais');
            tab.innerHTML = '';
            dadosAtuais.filiais.forEach(f => {
                tab.innerHTML += `
                    <tr>
                        <td>${f.nome}</td>
                        <td>${f.status}</td>
                        <td>
                            <button class="btn-warning" onclick="alterarStatusFilial('${f.id}', '${f.status === 'Ativa' ? 'Suspensa' : 'Ativa'}')">
                                ${f.status === 'Ativa' ? 'Suspender' : 'Ativar'}
                            </button>
                            <button class="btn-danger" onclick="excluirFilial('${f.id}')">X</button>
                        </td>
                    </tr>
                `;
            });
        }

        // --- AÇÕES DO USUÁRIO ---

        function aprovarPedido(idPedido, filialId) {
            ws.send(JSON.stringify({
                tipo: 'ATUALIZAR_STATUS_PEDIDO', idPedido: idPedido, novoStatus: 'Aprovado e Em Trânsito'
            }));
            
            // Remove o pisca-alerta do mapa daquela filial
            const ponto = document.getElementById(`ponto-${filialId}`);
            if (ponto) ponto.classList.remove('alerta-ativo');
        }

        function comprarEstoque() {
            const medId = document.getElementById('compra-medicamento').value;
            const qtd = parseInt(document.getElementById('compra-qtd').value);
            const nomeNovo = document.getElementById('compra-nome').value;

            if (!qtd) return alert('Insira uma quantidade válida.');

            ws.send(JSON.stringify({
                tipo: 'COMPRAR_MEDICAMENTO',
                medicamentoId: medId === 'novo' ? null : parseInt(medId),
                nomeNovoMedicamento: nomeNovo,
                quantidade: qtd
            }));
            
            document.getElementById('compra-qtd').value = '';
            document.getElementById('compra-nome').value = '';
        }

        function adicionarFilial() {
            const id = document.getElementById('nova-filial-id').value;
            const nome = document.getElementById('nova-filial-nome').value;
            if (id && nome) {
                ws.send(JSON.stringify({ tipo: 'GERENCIAR_FILIAL', acao: 'ADICIONAR', filialId: id, nome: nome }));
                document.getElementById('nova-filial-id').value = '';
                document.getElementById('nova-filial-nome').value = '';
            }
        }

        function alterarStatusFilial(id, novoStatus) {
            ws.send(JSON.stringify({ tipo: 'GERENCIAR_FILIAL', acao: 'ALTERAR_STATUS', filialId: id, novoStatus: novoStatus }));
        }

        function excluirFilial(id) {
            if(confirm('Tem certeza que deseja excluir esta filial?')) {
                ws.send(JSON.stringify({ tipo: 'GERENCIAR_FILIAL', acao: 'EXCLUIR', filialId: id }));
            }
        }
    </script>
</body>
</html>
